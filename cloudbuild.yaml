# Build image and deploy a Cloud Run Job (batch ingest).
# Jobs do not need port 8080 / startup probes — unlike Cloud Run Services.
#
# Trigger setup (Cloud Build → Triggers → Edit):
#   Configuration type: Cloud Build configuration file
#   Location: /cloudbuild.yaml
# Secret: create Secret Manager secret "OPEN_AI_API_KEY" (raw key only).

substitutions:
  _REGION: asia-southeast1
  _JOB_NAME: ai-assistant
  _AR_REPO: cloud-run-source-deploy
  _VECTOR_STORE_ID: vs_6aba3fdae1c88191b8a143612dea342a
  _HELP_CENTER_BASE_URL: https://support.optisigns.com
  _TASK_TIMEOUT: 60m

steps:
  - name: gcr.io/cloud-builders/docker
    id: Build
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_JOB_NAME}:$COMMIT_SHA
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_JOB_NAME}:latest
      - .

  - name: gcr.io/cloud-builders/docker
    id: Push
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_JOB_NAME}

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: Deploy
    entrypoint: gcloud
    args:
      - run
      - jobs
      - deploy
      - ${_JOB_NAME}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_JOB_NAME}:$COMMIT_SHA
      - --region=${_REGION}
      - --tasks=1
      - --max-retries=1
      - --task-timeout=${_TASK_TIMEOUT}
      - --set-secrets=OPEN_AI_API_KEY=OPEN_AI_API_KEY:latest
      - --set-env-vars=OPENAI_VECTOR_STORE_ID=${_VECTOR_STORE_ID},HELP_CENTER_BASE_URL=${_HELP_CENTER_BASE_URL}
      - --quiet

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_JOB_NAME}:$COMMIT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_JOB_NAME}:latest

options:
  logging: CLOUD_LOGGING_ONLY

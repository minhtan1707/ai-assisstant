# Build image and deploy a Cloud Run Service (ingest + chat API).
#
# Config comes from ONE Secret Manager secret that stores a full .env file:
#   Secret name: AI_ASSISTANT_ENV
#   Mounted at:  /secrets/.env
#
# Create/update the secret (PowerShell example):
#   Get-Content .env -Raw | gcloud secrets create AI_ASSISTANT_ENV --data-file=-
#   Get-Content .env -Raw | gcloud secrets versions add AI_ASSISTANT_ENV --data-file=-
#
# Grant the Cloud Run runtime SA secretAccessor on AI_ASSISTANT_ENV.

substitutions:
  _REGION: asia-southeast1
  _SERVICE_NAME: ai-assisstant
  _AR_REPO: cloud-run-source-deploy
  _ENV_SECRET: AI_ASSISTANT_ENV

steps:
  - name: gcr.io/cloud-builders/docker
    id: Build
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE_NAME}:$COMMIT_SHA
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE_NAME}:latest
      - .

  - name: gcr.io/cloud-builders/docker
    id: Push
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE_NAME}

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: Deploy
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_NAME}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE_NAME}:$COMMIT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --timeout=3600
      - --cpu=1
      - --memory=1Gi
      - --min-instances=0
      - --max-instances=3
      - --no-cpu-throttling
      - --set-secrets=/secrets/.env=${_ENV_SECRET}:latest
      - --set-env-vars=DOTENV_PATH=/secrets/.env
      - --command=uvicorn
      - --args=app:app,--host,0.0.0.0,--port,8080
      - --quiet

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE_NAME}:$COMMIT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE_NAME}:latest

options:
  logging: CLOUD_LOGGING_ONLY
